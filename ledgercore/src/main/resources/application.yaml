spring:
  application:
    name: lotusplus
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:5432/ledgercore
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  rabbitmq:
    host: localhost
    port: 5672
    username: rabbitmq
    password: rabbitmq
    publisher-confirm-type: correlated
    publisher-returns: true
    virtual-host: /

    connection-timeout: 5s

    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms

  cache:
    type: redis

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${SMTP_AUTH_USERNAME}
    password: ${SMTP_AUTH_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  app:
    name: Ledger
    mail:
      from: noreply@moryapp.com

redisson:
  address: redis://localhost:6379

server:
  port: 8080

jwt:
  app: ledgercore
  secret: ${JWT_SECRET}
  access-token-expiration: 15m

  refresh-token:
      expiration: 30d

ledger:
  system-account:
    cash-codes:
      VND: CASH_VND
      USD: CASH_USD


security:
  encryption:
    key: ${ENCRYPTION_KEY}

webhook:
  delivery:
    max-attempts: 5
    initial-delay-seconds: 5
    max-delay-seconds: 300
    processing-timeout-seconds: 60

business-day:
  timezone: Asia/Ho_Chi_Minh
  closing-cron: "0 30 23 * * *"
  closing-start: "23:30"

reconciliation:
  scheduler:
    enabled: false
    fixed-delay: 1000

app:
  webhook:
    allow-http: true

logging:
  level:
    com.example.ledgercore: DEBUG
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.orm.jdbc.extract: OFF