databaseChangeLog:

  - changeSet:
      id: 041-create-interest-runs
      author: tu

      changes:

        - createTable:
            tableName: interest_runs

            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_interest_runs
                    nullable: false

              - column:
                  name: business_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: started_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: completed_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: total_accounts
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: successful_accounts
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: failed_accounts
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: interest_runs
            columnNames: business_date
            constraintName: uk_interest_runs_business_date

        - createIndex:
            tableName: interest_runs
            indexName: idx_interest_runs_status
            columns:
              - column:
                  name: status

        - sql:
            sql: >
              ALTER TABLE interest_runs
              ADD CONSTRAINT chk_interest_runs_status
              CHECK (
                status IN (
                  'RUNNING',
                  'COMPLETED',
                  'FAILED'
                )
              );

        - sql:
            sql: >
              ALTER TABLE interest_runs
              ADD CONSTRAINT chk_interest_runs_account_counts
              CHECK (
                total_accounts >= 0
                AND successful_accounts >= 0
                AND failed_accounts >= 0
                AND successful_accounts + failed_accounts <= total_accounts
              );

        - addColumn:
            tableName: interest_accruals

            columns:

              - column:
                  name: run_id
                  type: UUID
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: interest_accruals
            baseColumnNames: run_id
            referencedTableName: interest_runs
            referencedColumnNames: id
            constraintName: fk_interest_accruals_run

        - createIndex:
            tableName: interest_accruals
            indexName: idx_interest_accruals_run_id
            columns:
              - column:
                  name: run_id