databaseChangeLog:

  - changeSet:
      id: 004-create-transactions
      author: tu

      changes:
        - createTable:
            tableName: transactions
            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_transactions
                    nullable: false

              - column:
                  name: reference
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(500)

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: completed_at
                  type: TIMESTAMP WITH TIME ZONE

        - addUniqueConstraint:
            tableName: transactions
            columnNames: reference
            constraintName: uk_transactions_reference

        - sql:
            sql: >
              ALTER TABLE transactions
              ADD CONSTRAINT chk_transactions_type
              CHECK (
                type IN (
                  'TRANSFER',
                  'DEPOSIT',
                  'WITHDRAW',
                  'FEE',
                  'REFUND'
                )
              );

        - sql:
            sql: >
              ALTER TABLE transactions
              ADD CONSTRAINT chk_transactions_status
              CHECK (
                status IN (
                  'PENDING',
                  'PROCESSING',
                  'COMPLETED',
                  'FAILED',
                  'REVERSED'
                )
              );