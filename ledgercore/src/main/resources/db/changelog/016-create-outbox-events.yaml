databaseChangeLog:

  - changeSet:
      id: 013-create-outbox-events
      author: tu

      changes:

        - createTable:
            tableName: outbox_events

            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: aggregate_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: aggregate_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: event_type
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: published
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: published_at
                  type: TIMESTAMP WITH TIME ZONE

        - createIndex:
            tableName: outbox_events
            indexName: idx_outbox_events_published_created_at
            columns:
              - column:
                  name: published
              - column:
                  name: created_at

        - createIndex:
            tableName: outbox_events
            indexName: idx_outbox_events_aggregate
            columns:
              - column:
                  name: aggregate_type
              - column:
                  name: aggregate_id