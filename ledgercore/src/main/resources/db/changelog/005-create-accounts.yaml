databaseChangeLog:

  - changeSet:
      id: 002-create-accounts
      author: tu

      changes:
        - createTable:
            tableName: accounts
            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_accounts
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: account_no
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false

              - column:
                  name: balance
                  type: NUMERIC(19,4)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false

              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: accounts
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_accounts_user
            onDelete: RESTRICT

        - addUniqueConstraint:
            tableName: accounts
            columnNames: account_no
            constraintName: uk_accounts_account_no

        - sql:
            sql: >
              ALTER TABLE accounts
              ADD CONSTRAINT chk_accounts_balance
              CHECK (balance >= 0);

        - sql:
            sql: >
              ALTER TABLE accounts
              ADD CONSTRAINT chk_accounts_status
              CHECK (status IN ('ACTIVE', 'BLOCKED', 'CLOSED'));

        - sql:
            sql: >
              ALTER TABLE accounts
              ADD CONSTRAINT chk_accounts_currency
              CHECK (currency IN ('VND', 'USD'));