databaseChangeLog:
  - changeSet:
      id: 089-create-credit-statement-runs
      author: tophantus
      changes:
        - createTable:
            tableName: credit_statement_runs
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: period_start
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: period_end
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: statement_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: due_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: last_processed_facility_id
                  type: UUID

              - column:
                  name: processed_count
                  type: BIGINT
                  defaultValueNumeric: 0

              - column:
                  name: started_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: heartbeat_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: completed_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueDate: now()
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: credit_statement_runs
            columnNames: period_start, period_end
            constraintName: uk_credit_statement_runs_period

        - createIndex:
            tableName: credit_statement_runs
            indexName: idx_credit_statement_runs_status
            columns:
              - column:
                  name: status