databaseChangeLog:
  - changeSet:
      id: 085-create-credit-interest-accruals-and-postings
      author: tophantus

      changes:
        - createTable:
            tableName: credit_interest_postings
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_credit_interest_postings
                    nullable: false

              - column:
                  name: credit_facility_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: run_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: period_start
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: period_end
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: interest_amount
                  type: NUMERIC(19,4)
                  constraints:
                    nullable: false

              - column:
                  name: transaction_id
                  type: UUID

              - column:
                  name: posted_at
                  type: TIMESTAMPTZ

              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: credit_interest_postings
            baseColumnNames: credit_facility_id
            referencedTableName: credit_facilities
            referencedColumnNames: id
            constraintName: fk_credit_interest_postings_facility

        - addForeignKeyConstraint:
            baseTableName: credit_interest_postings
            baseColumnNames: run_id
            referencedTableName: interest_runs
            referencedColumnNames: id
            constraintName: fk_credit_interest_postings_run

        - addForeignKeyConstraint:
            baseTableName: credit_interest_postings
            baseColumnNames: transaction_id
            referencedTableName: transactions
            referencedColumnNames: id
            constraintName: fk_credit_interest_postings_transaction

        - addUniqueConstraint:
            tableName: credit_interest_postings
            columnNames: credit_facility_id, period_start, period_end
            constraintName: uk_credit_interest_postings_facility_period

        - createIndex:
            tableName: credit_interest_postings
            indexName: idx_credit_interest_postings_facility
            columns:
              - column:
                  name: credit_facility_id

        - createIndex:
            tableName: credit_interest_postings
            indexName: idx_credit_interest_postings_period
            columns:
              - column:
                  name: period_start
              - column:
                  name: period_end

        - createIndex:
            tableName: credit_interest_postings
            indexName: idx_credit_interest_postings_run_id
            columns:
              - column:
                  name: run_id

        - createIndex:
            tableName: credit_interest_postings
            indexName: idx_credit_interest_postings_transaction
            columns:
              - column:
                  name: transaction_id

        - sql:
            sql: >
              ALTER TABLE credit_interest_postings
              ADD CONSTRAINT chk_credit_interest_postings_period
              CHECK (period_start <= period_end);

        - sql:
            sql: >
              ALTER TABLE credit_interest_postings
              ADD CONSTRAINT chk_credit_interest_postings_amount
              CHECK (interest_amount >= 0);

        - createTable:
            tableName: credit_interest_accruals
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_credit_interest_accruals
                    nullable: false

              - column:
                  name: credit_facility_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: business_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: principal_amount
                  type: NUMERIC(19,4)
                  constraints:
                    nullable: false

              - column:
                  name: interest_rate
                  type: NUMERIC(10,6)
                  constraints:
                    nullable: false

              - column:
                  name: interest_amount
                  type: NUMERIC(19,4)
                  constraints:
                    nullable: false

              - column:
                  name: journal_entry_id
                  type: UUID

              - column:
                  name: posting_id
                  type: UUID

              - column:
                  name: run_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: credit_interest_accruals
            baseColumnNames: credit_facility_id
            referencedTableName: credit_facilities
            referencedColumnNames: id
            constraintName: fk_credit_interest_accruals_facility

        - addForeignKeyConstraint:
            baseTableName: credit_interest_accruals
            baseColumnNames: journal_entry_id
            referencedTableName: journal_entries
            referencedColumnNames: id
            constraintName: fk_credit_interest_accruals_journal_entry

        - addForeignKeyConstraint:
            baseTableName: credit_interest_accruals
            baseColumnNames: posting_id
            referencedTableName: credit_interest_postings
            referencedColumnNames: id
            constraintName: fk_credit_interest_accruals_posting

        - addForeignKeyConstraint:
            baseTableName: credit_interest_accruals
            baseColumnNames: run_id
            referencedTableName: interest_runs
            referencedColumnNames: id
            constraintName: fk_credit_interest_accruals_run

        - addUniqueConstraint:
            tableName: credit_interest_accruals
            columnNames: credit_facility_id, business_date
            constraintName: uk_credit_interest_accruals_facility_date

        - createIndex:
            tableName: credit_interest_accruals
            indexName: idx_credit_interest_accruals_facility_date
            columns:
              - column:
                  name: credit_facility_id
              - column:
                  name: business_date

        - createIndex:
            tableName: credit_interest_accruals
            indexName: idx_credit_interest_accruals_business_date
            columns:
              - column:
                  name: business_date

        - createIndex:
            tableName: credit_interest_accruals
            indexName: idx_credit_interest_accruals_posting_id
            columns:
              - column:
                  name: posting_id

        - createIndex:
            tableName: credit_interest_accruals
            indexName: idx_credit_interest_accruals_run_id
            columns:
              - column:
                  name: run_id

        - sql:
            sql: >
              ALTER TABLE credit_interest_accruals
              ADD CONSTRAINT chk_credit_interest_accruals_principal
              CHECK (principal_amount >= 0);

        - sql:
            sql: >
              ALTER TABLE credit_interest_accruals
              ADD CONSTRAINT chk_credit_interest_accruals_rate
              CHECK (interest_rate >= 0);

        - sql:
            sql: >
              ALTER TABLE credit_interest_accruals
              ADD CONSTRAINT chk_credit_interest_accruals_amount
              CHECK (interest_amount >= 0);

        - sql:
            sql: >
              ALTER TABLE interest_runs
              DROP CONSTRAINT chk_interest_runs_run_type;

        - sql:
            sql: >
              ALTER TABLE interest_runs
              ADD CONSTRAINT chk_interest_runs_run_type
              CHECK (
                run_type IN (
                  'ACCRUAL',
                  'POSTING',
                  'CREDIT_ACCRUAL',
                  'CREDIT_POSTING'
                )
              );
