databaseChangeLog:

  - changeSet:
      id: 038-create-interest-postings
      author: tu

      changes:

        - createTable:
            tableName: interest_postings

            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_interest_postings
                    nullable: false

              - column:
                  name: account_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: period_start
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: period_end
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: interest_amount
                  type: DECIMAL(19,4)
                  constraints:
                    nullable: false

              - column:
                  name: transaction_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: posted_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: interest_postings
            baseColumnNames: account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_interest_postings_account

        - addForeignKeyConstraint:
            baseTableName: interest_postings
            baseColumnNames: transaction_id
            referencedTableName: transactions
            referencedColumnNames: id
            constraintName: fk_interest_postings_transaction

        - addUniqueConstraint:
            tableName: interest_postings
            columnNames: account_id, period_start, period_end
            constraintName: uk_interest_postings_account_period

        - createIndex:
            tableName: interest_postings
            indexName: idx_interest_postings_account
            columns:
              - column:
                  name: account_id

        - createIndex:
            tableName: interest_postings
            indexName: idx_interest_postings_period
            columns:
              - column:
                  name: period_start

              - column:
                  name: period_end

        - createIndex:
            tableName: interest_postings
            indexName: idx_interest_postings_transaction
            columns:
              - column:
                  name: transaction_id

        - sql:
            sql: >
              ALTER TABLE interest_postings
              ADD CONSTRAINT chk_interest_postings_period
              CHECK (period_start <= period_end);

        - sql:
            sql: >
              ALTER TABLE interest_postings
              ADD CONSTRAINT chk_interest_postings_amount
              CHECK (interest_amount >= 0);