databaseChangeLog:
  - changeSet:
      id: 071-create-credit-holds
      author: tophantus
      changes:
        - createTable:
            tableName: credit_holds
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: credit_facility_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false

              - column:
                  name: hold_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: reference_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: reference_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: released_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - createIndex:
            tableName: credit_holds
            indexName: idx_credit_holds_facility_status
            columns:
              - column:
                  name: credit_facility_id
              - column:
                  name: status

        - createIndex:
            tableName: credit_holds
            indexName: idx_credit_holds_reference
            columns:
              - column:
                  name: reference_type
              - column:
                  name: reference_id

        - createIndex:
            tableName: credit_holds
            indexName: idx_credit_holds_expires_at
            columns:
              - column:
                  name: expires_at