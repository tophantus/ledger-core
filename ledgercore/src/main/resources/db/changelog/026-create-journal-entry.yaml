databaseChangeLog:

  - changeSet:
      id: 026-create-journal-entries
      author: ledgercore

      changes:
        - createTable:
            tableName: journal_entries
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: transaction_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: journal_entries
            columnNames: transaction_id
            constraintName: uk_journal_entries_transaction_id


  - changeSet:
      id: 026-create-journal-entry-lines
      author: ledgercore

      changes:
        - createTable:
            tableName: journal_entry_lines
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: journal_entry_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: ledger_account_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: entry_type
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: NUMERIC(19,4)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: journal_entry_lines
            baseColumnNames: journal_entry_id
            referencedTableName: journal_entries
            referencedColumnNames: id
            constraintName: fk_journal_entry_lines_journal_entry

        - createIndex:
            tableName: journal_entry_lines
            indexName: idx_journal_entry_lines_journal_entry_id
            columns:
              - column:
                  name: journal_entry_id

        - createIndex:
            tableName: journal_entry_lines
            indexName: idx_journal_entry_lines_ledger_account_id
            columns:
              - column:
                  name: ledger_account_id