databaseChangeLog:

  - changeSet:
      id: 003-create-ledger-accounts
      author: tu

      changes:
        - createTable:
            tableName: ledger_accounts
            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_ledger_accounts
                    nullable: false

              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: ledger_accounts
            columnNames: code
            constraintName: uk_ledger_accounts_code

        - sql:
            sql: >
              ALTER TABLE ledger_accounts
              ADD CONSTRAINT chk_ledger_accounts_type
              CHECK (
                type IN (
                  'ASSET',
                  'LIABILITY',
                  'EQUITY',
                  'REVENUE',
                  'EXPENSE'
                )
              );

        - sql:
            sql: >
              ALTER TABLE ledger_accounts
              ADD CONSTRAINT chk_ledger_accounts_status
              CHECK (status IN ('ACTIVE', 'BLOCKED', 'CLOSED'));

        - sql:
            sql: >
              ALTER TABLE ledger_accounts
              ADD CONSTRAINT chk_ledger_accounts_currency
              CHECK (currency IN ('VND', 'USD'));