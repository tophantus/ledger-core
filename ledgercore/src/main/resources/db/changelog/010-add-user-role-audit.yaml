databaseChangeLog:

  - changeSet:
      id: 010-add-user-role-audit
      author: tu

      changes:

        - addColumn:
            tableName: user_roles
            columns:

              - column:
                  name: assigned_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: assigned_by
                  type: UUID

        - sql:
            sql: >
              UPDATE user_roles
              SET assigned_at = NOW()
              WHERE assigned_at IS NULL;

        - addNotNullConstraint:
            tableName: user_roles
            columnName: assigned_at
            columnDataType: TIMESTAMP WITH TIME ZONE

        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: assigned_by
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_roles_assigned_by
            onDelete: SET NULL

        - createIndex:
            tableName: user_roles
            indexName: idx_user_roles_assigned_by
            columns:
              - column:
                  name: assigned_by