databaseChangeLog:
  - changeSet:
      id: 073-create-payment-providers
      author: tophantus
      changes:
        - createTable:
            tableName: payment_providers
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: code
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: varchar(30)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false

              - column:
                  name: client_id
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: credential_hash
                  type: varchar
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: payment_providers
            columnNames: code
            constraintName: uk_payment_providers_code

        - addUniqueConstraint:
            tableName: payment_providers
            columnNames: client_id
            constraintName: uk_payment_providers_client_id