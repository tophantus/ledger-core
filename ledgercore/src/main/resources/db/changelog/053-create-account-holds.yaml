databaseChangeLog:
  - changeSet:
      id: 053-create-account-holds
      author: tu

      changes:
        - createTable:
            tableName: account_holds
            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_account_holds
                    nullable: false

              - column:
                  name: account_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: NUMERIC(19,4)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false

              - column:
                  name: hold_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: reference_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: reference_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: TIMESTAMPTZ

              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

              - column:
                  name: released_at
                  type: TIMESTAMPTZ

              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: account_holds
            baseColumnNames: account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_account_holds_account

        - sql:
            sql: |
              ALTER TABLE account_holds
              ADD CONSTRAINT chk_account_holds_amount_positive
              CHECK (amount > 0);

        - createIndex:
            tableName: account_holds
            indexName: idx_account_holds_account_status
            columns:
              - column:
                  name: account_id
              - column:
                  name: status

        - createIndex:
            tableName: account_holds
            indexName: idx_account_holds_reference
            columns:
              - column:
                  name: reference_type
              - column:
                  name: reference_id

        - createIndex:
            tableName: account_holds
            indexName: idx_account_holds_expires_at
            columns:
              - column:
                  name: expires_at