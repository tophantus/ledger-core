databaseChangeLog:

  - changeSet:
      id: 029-create-transfer-intents
      author: ledgercore

      changes:

        - createTable:
            tableName: transfer_intents
            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_transfer_intents

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: source_account_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: destination_account_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: NUMERIC(19,4)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false

              - column:
                  name: reference
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(500)

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: completed_at
                  type: TIMESTAMP WITH TIME ZONE

        - createIndex:
            indexName: idx_transfer_intents_user_id
            tableName: transfer_intents
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_transfer_intents_status
            tableName: transfer_intents
            columns:
              - column:
                  name: status

        - createIndex:
            indexName: idx_transfer_intents_expires_at
            tableName: transfer_intents
            columns:
              - column:
                  name: expires_at

        - addUniqueConstraint:
            tableName: transfer_intents
            columnNames: reference
            constraintName: uk_transfer_intents_reference