databaseChangeLog:
  - changeSet:
      id: 060-create-card-vault-secrets
      author: tophantus

      changes:
        - createTable:
            tableName: card_vault_secrets
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: card_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: encrypted_pan
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: encrypted_cvv
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: encryption_version
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: card_vault_secrets
            baseColumnNames: card_id
            referencedTableName: cards
            referencedColumnNames: id
            constraintName: fk_card_vault_secrets_card