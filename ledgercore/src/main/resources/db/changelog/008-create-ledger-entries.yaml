databaseChangeLog:

  - changeSet:
      id: 005-create-ledger-entries
      author: tu

      changes:
        - createTable:
            tableName: ledger_entries
            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_ledger_entries
                    nullable: false

              - column:
                  name: transaction_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: ledger_account_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: entry_type
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: NUMERIC(19,4)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: ledger_entries
            baseColumnNames: transaction_id
            referencedTableName: transactions
            referencedColumnNames: id
            constraintName: fk_ledger_entries_transaction
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            baseTableName: ledger_entries
            baseColumnNames: ledger_account_id
            referencedTableName: ledger_accounts
            referencedColumnNames: id
            constraintName: fk_ledger_entries_ledger_account
            onDelete: RESTRICT

        - sql:
            sql: >
              ALTER TABLE ledger_entries
              ADD CONSTRAINT chk_ledger_entries_type
              CHECK (entry_type IN ('DEBIT', 'CREDIT'));

        - sql:
            sql: >
              ALTER TABLE ledger_entries
              ADD CONSTRAINT chk_ledger_entries_amount
              CHECK (amount > 0);

        - sql:
            sql: >
              ALTER TABLE ledger_entries
              ADD CONSTRAINT chk_ledger_entries_currency
              CHECK (currency IN ('VND', 'USD'));