databaseChangeLog:
  - changeSet:
      id: 059-create-card-credentials
      author: tophantus

      changes:
        - createTable:
            tableName: card_credentials
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: card_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: pin_verifier
                  type: TEXT

              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: card_credentials
            baseColumnNames: card_id
            referencedTableName: cards
            referencedColumnNames: id
            constraintName: fk_card_credentials_card