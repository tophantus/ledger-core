databaseChangeLog:
  - changeSet:
      id: 062-create-credit-statements
      author: tophantus

      changes:
        - createTable:
            tableName: credit_statements
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: credit_facility_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: period_start
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: period_end
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: statement_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: due_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: opening_balance
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: purchases_amount
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: payments_amount
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: fees_amount
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: interest_amount
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: closing_balance
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: minimum_payment
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: credit_statements
            baseColumnNames: credit_facility_id
            referencedTableName: credit_facilities
            referencedColumnNames: id
            constraintName: fk_credit_statements_credit_facility

        - addUniqueConstraint:
            tableName: credit_statements
            columnNames: credit_facility_id, period_start, period_end
            constraintName: uk_credit_statements_period

        - createIndex:
            tableName: credit_statements
            indexName: idx_credit_statements_due_date
            columns:
              - column:
                  name: due_date