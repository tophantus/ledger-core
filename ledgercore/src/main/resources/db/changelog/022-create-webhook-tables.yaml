databaseChangeLog:

  - changeSet:
      id: 022-create-webhook-endpoints
      author: tu

      changes:

        - createTable:
            tableName: webhook_endpoints
            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_webhook_endpoints
                    nullable: false

              - column:
                  name: account_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: url
                  type: VARCHAR(2048)
                  constraints:
                    nullable: false

              - column:
                  name: secret
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: webhook_endpoints
            columnNames: account_id, url
            constraintName: uk_webhook_endpoints_account_url

        - createIndex:
            tableName: webhook_endpoints
            indexName: idx_webhook_endpoints_account_id
            columns:
              - column:
                  name: account_id

        - createIndex:
            tableName: webhook_endpoints
            indexName: idx_webhook_endpoints_status
            columns:
              - column:
                  name: status

        - sql:
            sql: >
              ALTER TABLE webhook_endpoints
              ADD CONSTRAINT chk_webhook_endpoints_status
              CHECK (
                status IN (
                  'ACTIVE',
                  'INACTIVE'
                )
              );


  - changeSet:
      id: 022-create-webhook-subscriptions
      author: tu

      changes:

        - createTable:
            tableName: webhook_subscriptions
            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_webhook_subscriptions
                    nullable: false

              - column:
                  name: webhook_endpoint_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: event_type
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: webhook_subscriptions
            baseColumnNames: webhook_endpoint_id
            referencedTableName: webhook_endpoints
            referencedColumnNames: id
            constraintName: fk_webhook_subscriptions_endpoint

        - addUniqueConstraint:
            tableName: webhook_subscriptions
            columnNames: webhook_endpoint_id, event_type
            constraintName: uk_webhook_subscriptions_endpoint_event

        - createIndex:
            tableName: webhook_subscriptions
            indexName: idx_webhook_subscriptions_endpoint_id
            columns:
              - column:
                  name: webhook_endpoint_id

        - createIndex:
            tableName: webhook_subscriptions
            indexName: idx_webhook_subscriptions_event_type
            columns:
              - column:
                  name: event_type