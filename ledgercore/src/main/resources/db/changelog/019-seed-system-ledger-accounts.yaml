databaseChangeLog:

  - changeSet:
      id: 019-seed-system-ledger-accounts
      author: tu

      changes:

        - insert:
            tableName: ledger_accounts
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()
              - column:
                  name: code
                  value: CASH_VND
              - column:
                  name: name
                  value: Cash VND
              - column:
                  name: type
                  value: ASSET
              - column:
                  name: currency
                  value: VND
              - column:
                  name: status
                  value: ACTIVE
              - column:
                  name: created_at
                  valueDate: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  valueDate: CURRENT_TIMESTAMP

        - insert:
            tableName: ledger_accounts
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()
              - column:
                  name: code
                  value: CASH_USD
              - column:
                  name: name
                  value: Cash USD
              - column:
                  name: type
                  value: ASSET
              - column:
                  name: currency
                  value: USD
              - column:
                  name: status
                  value: ACTIVE
              - column:
                  name: created_at
                  valueDate: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  valueDate: CURRENT_TIMESTAMP